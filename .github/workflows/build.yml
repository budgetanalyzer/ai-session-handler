name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Synchronize frozen dependency graph
        env:
          PYTHONPATH: src
        run: python -m ai_session_handler.dev_bootstrap

      - name: Check formatting
        run: .venv/bin/python -m ruff format --check .

      - name: Lint
        run: .venv/bin/python -m ruff check .

      - name: Type check
        run: .venv/bin/python -m mypy src tests

      - name: Test
        run: .venv/bin/python -m pytest
