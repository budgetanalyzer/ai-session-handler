[build-system]
requires = ["setuptools>=84.0.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-session-handler"
version = "0.2.0"
description = "Provider-agnostic runner for short AI agent plan phases."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Bleu Rubin" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=2.4.0,<3",
  "pytest>=9.1.1,<10",
  "ruff>=0.17.0,<0.18",
]

[dependency-groups]
build = [
  "setuptools>=84.0.0,<85",
]

[project.scripts]
ai-session-handler = "ai_session_handler.cli:main"
ai-session-handler-claude-high = "ai_session_handler.provider_wrappers.claude_print_filter:main_high"
ai-session-handler-claude-medium = "ai_session_handler.provider_wrappers.claude_print_filter:main_medium"
ai-session-handler-codex-high = "ai_session_handler.provider_wrappers.codex_high_exec_filter:main"

[tool.dependency-contract]
# renovate: datasource=pypi depName=uv
uv = "0.13.5"

[tool.uv]
no-build-isolation-package = ["ai-session-handler"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_session_handler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers --import-mode=importlib"
